name: Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Build, Lint & Automated xUnit Test Gate)
  # ============================================================================
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DotnetProject.sln

      - name: Build Solution (Release)
        run: dotnet build --configuration Release --no-restore DotnetProject.sln

      - name: Execute Automated xUnit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" DotnetProject.sln

      - name: Publish Web Application Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish MVC/DotnetProject.Web.csproj --configuration Release -o ./publish-web

      - name: Publish REST API Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish DotnetProject.Api/DotnetProject.Api.csproj --configuration Release -o ./publish-api

      - name: Upload Web Build Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-web-release
          path: ./publish-web/
          retention-days: 7

      - name: Upload API Build Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-api-release
          path: ./publish-api/
          retention-days: 7

  # ============================================================================
  # STAGE 2: Continuous Deployment to AWS Linux EC2 (Dual systemd Daemons)
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    continue-on-error: true # Allows CI pipeline to pass even when EC2 instance is stopped for cloud cost savings

    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-web-release
          path: ./release-web

      - name: Download API Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-api-release
          path: ./release-api

      - name: Copy Web Artifacts to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./release-web/*"
          target: "/tmp/dotnetapp-update"
          strip_components: 1

      - name: Copy API Artifacts to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./release-api/*"
          target: "/tmp/dotnetapi-update"
          strip_components: 1

      - name: Apply Deployment on EC2 and Restart systemd Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "--- Stopping existing services ---"
            sudo systemctl stop dotnetapp.service || true
            sudo systemctl stop dotnetapi.service || true

            echo "--- Syncing Web binaries to /var/www/dotnetapp ---"
            sudo mkdir -p /var/www/dotnetapp
            sudo cp -r /tmp/dotnetapp-update/* /var/www/dotnetapp/
            sudo rm -rf /tmp/dotnetapp-update

            echo "--- Syncing API binaries to /var/www/dotnetapi ---"
            sudo mkdir -p /var/www/dotnetapi
            sudo cp -r /tmp/dotnetapi-update/* /var/www/dotnetapi/
            sudo rm -rf /tmp/dotnetapi-update

            echo "--- Setting permissions ---"
            sudo chown -R www-data:www-data /var/www/dotnetapp /var/www/dotnetapi
            sudo chmod -R 755 /var/www/dotnetapp /var/www/dotnetapi

            echo "--- Reloading and restarting systemd services ---"
            sudo systemctl daemon-reload
            sudo systemctl restart dotnetapp.service
            sudo systemctl restart dotnetapi.service || true
            sudo systemctl is-active --quiet dotnetapp.service && echo "Web service is ACTIVE"

            echo "--- Running Smoke Tests ---"
            sleep 3
            curl -s -f http://127.0.0.1:5000/health || curl -s -f http://localhost/health
            curl -s -f http://127.0.0.1:5050/api/health || true
            echo "Smoke tests PASSED! Dual-service deployment complete."
