name: Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Build, Lint & Automated xUnit Test Gate)
  # ============================================================================
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DotnetProject.sln

      - name: Build Solution (Release)
        run: dotnet build --configuration Release --no-restore DotnetProject.sln

      - name: Execute Automated xUnit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" DotnetProject.sln

      - name: Publish Web Application Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish MVC/DotnetProject.Web.csproj --configuration Release -o ./publish-output

      - name: Upload Build Artifact for Deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-web-release
          path: ./publish-output/
          retention-days: 7

  # ============================================================================
  # STAGE 2: Continuous Deployment to AWS Linux EC2 (systemd & Kestrel)
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Download Published Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-web-release
          path: ./release

      - name: Copy Artifacts to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./release/*"
          target: "/tmp/dotnetapp-update"
          strip_components: 1

      - name: Apply Deployment on EC2 and Restart systemd Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Starting Automated EC2 Deployment ==="

            # 1. Ensure .NET 8 Runtime is installed on EC2
            if ! command -v dotnet &> /dev/null; then
              echo "--- .NET not found: Installing .NET 8 ASP.NET Core Runtime ---"
              REPO_VERSION=$(lsb_release -rs)
              wget -q "https://packages.microsoft.com/config/ubuntu/${REPO_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
              sudo dpkg -i /tmp/packages-microsoft-prod.deb
              rm -f /tmp/packages-microsoft-prod.deb
              sudo apt-get update -y
              sudo apt-get install -y aspnetcore-runtime-8.0
              echo ".NET 8 Runtime installed successfully."
            fi

            # 2. Ensure systemd service file exists on EC2
            if [ ! -f /etc/systemd/system/dotnetapp.service ]; then
              echo "--- Provisioning /etc/systemd/system/dotnetapp.service ---"
              sudo bash -c 'cat <<EOF > /etc/systemd/system/dotnetapp.service
            [Unit]
            Description=ASP.NET Core Web Application (DevOps Release Tracker)
            After=network.target

            [Service]
            WorkingDirectory=/var/www/dotnetapp
            ExecStart=/usr/bin/dotnet /var/www/dotnetapp/DotnetProject.Web.dll
            Restart=always
            RestartSec=10
            KillSignal=SIGINT
            SyslogIdentifier=dotnetapp
            User=www-data
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false
            Environment=ASPNETCORE_URLS=http://127.0.0.1:5000
            EnvironmentFile=-/etc/dotnetapp.env
            ProtectSystem=full
            NoNewPrivileges=true

            [Install]
            WantedBy=multi-user.target
            EOF'
              sudo systemctl daemon-reload
              sudo systemctl enable dotnetapp.service
              echo "dotnetapp.service installed and enabled."
            fi

            # 3. Ensure baseline /etc/dotnetapp.env exists
            if [ ! -f /etc/dotnetapp.env ]; then
              echo "--- Creating baseline /etc/dotnetapp.env ---"
              sudo bash -c 'cat <<EOF > /etc/dotnetapp.env
            # Server environment variables - Never committed to source control
            ASPNETCORE_ENVIRONMENT=Production
            EOF'
              sudo chmod 600 /etc/dotnetapp.env
              sudo chown www-data:www-data /etc/dotnetapp.env
            fi

            # 4. Ensure Nginx is installed and configured as reverse proxy
            if ! command -v nginx &> /dev/null; then
              echo "--- Installing Nginx ---"
              sudo apt-get update -y
              sudo apt-get install -y nginx
            fi

            if [ ! -f /etc/nginx/sites-available/dotnetapp ]; then
              echo "--- Configuring Nginx reverse proxy for port 80 -> 5000 ---"
              sudo bash -c 'cat <<EOF > /etc/nginx/sites-available/dotnetapp
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade \$http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host \$host;
        proxy_cache_bypass \$http_upgrade;
        proxy_set_header   X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto \$scheme;
        proxy_set_header   X-Real-IP \$remote_addr;
    }

    location /health {
        proxy_pass         http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host \$host;
    }
}
EOF'
              sudo ln -sf /etc/nginx/sites-available/dotnetapp /etc/nginx/sites-enabled/dotnetapp
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t
              sudo systemctl restart nginx
              sudo systemctl enable nginx
              echo "Nginx reverse proxy active on port 80."
            else
              sudo systemctl restart nginx || true
            fi

            # 5. Stop existing service and sync new binaries
            echo "--- Stopping existing application service (if active) ---"
            sudo systemctl stop dotnetapp.service || true

            echo "--- Syncing release binaries to /var/www/dotnetapp ---"
            sudo mkdir -p /var/www/dotnetapp
            sudo cp -r /tmp/dotnetapp-update/* /var/www/dotnetapp/
            sudo rm -rf /tmp/dotnetapp-update

            # 6. Set secure file ownership and permissions
            echo "--- Setting permissions ---"
            sudo chown -R www-data:www-data /var/www/dotnetapp
            sudo chmod -R 755 /var/www/dotnetapp

            # 7. Restart systemd daemon and verify active state
            echo "--- Restarting dotnetapp.service ---"
            sudo systemctl daemon-reload
            sudo systemctl restart dotnetapp.service
            sleep 3
            sudo systemctl is-active --quiet dotnetapp.service && echo "Service is ACTIVE and running!"

            # 8. Smoke test
            echo "--- Running Smoke Test against /health endpoint (via Nginx port 80 and Kestrel port 5000) ---"
            curl -s -f http://127.0.0.1/health || curl -s -f http://127.0.0.1:5000/health
            echo ""
            echo "=== Smoke test PASSED! Application is publicly live on port 80! ==="
