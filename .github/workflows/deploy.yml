name: Build, Test & Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Build, Lint & Automated xUnit Test Gate)
  # ============================================================================
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DotnetProject.sln

      - name: Build Solution (Release)
        run: dotnet build --configuration Release --no-restore DotnetProject.sln

      - name: Execute Automated xUnit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" DotnetProject.sln

      - name: Publish Web Application Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish MVC/DotnetProject.Web.csproj --configuration Release -o ./publish-output

      - name: Upload Build Artifact for Deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-web-release
          path: ./publish-output/
          retention-days: 7

  # ============================================================================
  # STAGE 2: Continuous Deployment to AWS Linux EC2 (systemd & Kestrel)
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Download Published Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-web-release
          path: ./release

      - name: Copy Artifacts to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./release/*"
          target: "/tmp/dotnetapp-update"
          strip_components: 1

      - name: Apply Deployment on EC2 and Restart systemd Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "--- Stopping existing application service ---"
            sudo systemctl stop dotnetapp.service || true

            echo "--- Syncing binaries to /var/www/dotnetapp ---"
            sudo mkdir -p /var/www/dotnetapp
            sudo cp -r /tmp/dotnetapp-update/* /var/www/dotnetapp/
            sudo rm -rf /tmp/dotnetapp-update

            echo "--- Setting permissions ---"
            sudo chown -R www-data:www-data /var/www/dotnetapp
            sudo chmod -R 755 /var/www/dotnetapp

            echo "--- Starting and enabling dotnetapp.service ---"
            sudo systemctl daemon-reload
            sudo systemctl restart dotnetapp.service
            sudo systemctl is-active --quiet dotnetapp.service && echo "Service is ACTIVE"

            echo "--- Running Smoke Test against /health endpoint ---"
            sleep 3
            curl -s -f http://127.0.0.1:5000/health || curl -s -f http://localhost/health
            echo "Smoke test PASSED! Deployment complete."
