services:
  # ==========================================
  # 1. MySQL 8.0 Relational Database
  # ==========================================
  db:
    image: mysql:8.0
    container_name: dotnet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: devops_deployments
      MYSQL_USER: appuser
      MYSQL_PASSWORD: AppPassword123!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-pAppPassword123!"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. ASP.NET Core 8.0 REST API Microservice
  # ==========================================
  api:
    build:
      context: .
      dockerfile: DotnetProject.Api/Dockerfile
    container_name: dotnet-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: MySql
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=devops_deployments;User=appuser;Password=AppPassword123!;"
    ports:
      - "5050:5050"

  # ==========================================
  # 3. Angular 20 Standalone SPA + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dotnet-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  db_data:
